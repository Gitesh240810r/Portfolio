<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations | Gitesh</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/27dfd8c49e.js" crossorigin="anonymous"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              base: "var(--bg-base)",
              surface: "var(--bg-surface)",
              elevated: "var(--bg-elevated)",
              muted: "var(--bg-muted)",
              primary: {
                DEFAULT: "var(--accent-violet)",
                blue: "var(--accent-blue)",
                indigo: "var(--accent-indigo)",
                violet: "var(--accent-violet)",
                purple: "var(--accent-purple)",
              },
              ink: {
                DEFAULT: "var(--text-primary)",
                secondary: "var(--text-secondary)",
                muted: "var(--text-muted)",
              },
            },
          },
        },
      };
    </script>
</head>
<body class="min-h-screen">

    <header class="fixed top-0 left-0 w-full z-50 border-b border-[color:var(--border)] bg-[color:var(--bg-elevated)]/85 backdrop-blur-md">
        <nav class="flex justify-between items-center px-4 py-2">
            <h1 id="name" class="text-2xl font-bold text-ink">Gitesh</h1>
            <ul class="flex justify-betwee items-center gap-4 text-ink-secondary">
                <li><a href="index.html#hero" class="hover:text-ink transition-colors">Home</a></li>
                <li><a href="index.html#about" class="hover:text-ink transition-colors">About</a></li>
                <li><a href="index.html#services" class="hover:text-ink transition-colors">Services</a></li>
                <li><a href="index.html#projects" class="hover:text-ink transition-colors">Projects</a></li>
                <li><a href="index.html#contact" class="hover:text-ink transition-colors">Contact</a></li>
            </ul>
        </nav>
    </header>>

    <main>
        <section class="relative overflow-hidden text-center">
            <div class="absolute inset-0 pointer-events-none">
                <div class="absolute left-0 top-16 h-56 w-56 rounded-full bg-blue-500/10 blur-3xl"></div>
                <div class="absolute right-0 top-24 h-64 w-64 rounded-full bg-violet-500/10 blur-3xl"></div>
            </div>

            <div class="relative mx-auto flex max-w-[1250px] flex-col gap-10 px-5 pb-12 pt-20 md:pb-16 md:pt-24">
                <div class="max-w-3xl mx-auto">
                    <p class="text-sm uppercase  text-ink-muted">Selected Illustration Work</p>
                    <h1 class="mt-4 text-4xl font-bold tracking-tight text-ink md:text-5xl">Illustrations that piqued my perspective</h1>
                </div>

                <div class="max-w-xl mx-auto w-full">
                    <div class="flex items-center gap-3 rounded-2xl border border-white/10 bg-slate-900/60 px-5 py-4 text-ink-secondary">
                        <i class="fa-solid fa-magnifying-glass text-sm text-ink-muted"></i>
                        <div class="h-5 w-px bg-white/10"></div>
                        <input class="text-sm bg-transparent w-full p-3 " placeholder="Search illustrations"></input>
                    </div>
                </div>
            </div>
        </section>

        <section class="pb-16">
            <div class="mx-auto max-w-[1250px] px-5">
                <div
                    id="illustrationGrid"
                    class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3"
                    aria-live="polite"
                >
                </div>
            </div>
        </section>
    </main>

    <template id="illustrationCardTemplate">
        <article class="overflow-hidden rounded-2xl border border-white/10 bg-slate-800/85 shadow-[0_14px_34px_rgba(2,6,23,0.2)]">
            <div class="aspect-[4/3] w-full bg-slate-900/80"></div>
            <div class="p-5">
                <div class="flex items-center justify-between gap-3">
                    <h3 class="text-xl font-semibold text-ink">Project Title</h3>
                    <i class="fa-solid fa-arrow-up-right-from-square text-sm text-ink-muted"></i>
                </div>
                <p class="mt-3 text-sm leading-7 text-ink-secondary">
                    Short project description goes here. This structure is only a template for future dynamic rendering.
                </p>
                <div class="mt-4 flex flex-wrap gap-2">
                    <span class="rounded-full border border-white/10 bg-slate-900/70 px-3 py-1 text-xs text-ink-secondary">Illustrator</span>
                    <span class="rounded-full border border-white/10 bg-slate-900/70 px-3 py-1 text-xs text-ink-secondary">Vector</span>
                </div>
            </div>
        </article>
    </template>
</body>
</html>
